<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>English Speaking Challenge</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Custom styles for iPad optimization and animations */
        body {
            background-color: #f8fafc;
            -webkit-tap-highlight-color: transparent; /* Remove tap highlight on iOS */
        }
        
        .question-box {
            transition: transform 0.15s cubic-bezier(0.4, 0, 0.2, 1), box-shadow 0.15s ease, border-color 0.15s ease;
            cursor: pointer;
            aspect-ratio: 1 / 1;
            touch-action: manipulation; /* Removes tap delay on iPad */
            -webkit-appearance: none; /* Normalizes button rendering on iOS */
            width: 100%;
        }

        /* iPad touch friendly press effect */
        .question-box:active {
            transform: scale(0.92);
        }

        @media (hover: hover) {
            .question-box:hover {
                transform: translateY(-4px) scale(1.02);
                box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
                border-color: #e2e8f0;
            }
        }

        /* Modal styles with Apple-like glassmorphism */
        .modal {
            display: none;
            position: fixed;
            z-index: 50;
            inset: 0;
            background-color: rgba(15, 23, 42, 0.4);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .modal.show {
            opacity: 1;
        }

        .modal-content {
            background-color: #ffffff;
            margin: auto;
            border-radius: 2rem; /* Extra rounded for modern tablet UI */
            width: 92%;
            max-width: 680px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
            transform: scale(0.95) translateY(10px);
            opacity: 0;
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            display: flex;
            flex-direction: column;
            max-height: 90vh;
        }

        .modal.show .modal-content {
            transform: scale(1) translateY(0);
            opacity: 1;
        }

        .question-box.completed {
            background-color: #f1f5f9; /* Slate 100 */
            border-color: #e2e8f0;
            box-shadow: none;
        }
        
        @media (hover: hover) {
            .question-box.completed:hover {
                transform: translateY(-2px) scale(1.01);
                box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.05);
            }
        }

        .question-box.completed .number-text {
            opacity: 0.35;
            background: #94a3b8; /* Slate 400 */
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .question-box.completed .check-icon {
            opacity: 1;
            transform: scale(1);
        }

        .check-icon {
            opacity: 0;
            transform: scale(0.5);
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        /* Hide scrollbar for clean UI but allow scrolling */
        .hide-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .hide-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
</head>
<body class="min-h-screen text-slate-800 p-4 md:p-10 lg:p-12 font-sans selection:bg-indigo-100">

    <div class="max-w-7xl mx-auto">
        <header class="text-center mb-10 md:mb-14 pt-4 md:pt-8">
            <h1 class="text-4xl md:text-5xl lg:text-6xl font-extrabold text-slate-900 mb-4 tracking-tight">Speaking Challenge</h1>
            <p class="text-lg md:text-xl text-slate-500 font-medium max-w-2xl mx-auto px-4">Tap any box to reveal a topic. Challenge yourself to speak for 1-2 minutes!</p>
        </header>

        <!-- Grid container optimized for tablets (5 cols on portrait, 6 on landscape) -->
        <div id="challenge-grid" class="grid grid-cols-3 sm:grid-cols-4 md:grid-cols-5 lg:grid-cols-6 xl:grid-cols-8 gap-4 md:gap-6 pb-12">
            <!-- Boxes will be generated here by JavaScript -->
        </div>
    </div>

    <div id="questionModal" class="modal flex items-center justify-center p-4">
        <div class="modal-content relative overflow-hidden">
            
            <!-- Close Button -->
            <button id="close-modal-btn" class="absolute top-4 right-4 md:top-6 md:right-6 p-2 bg-slate-100 hover:bg-slate-200 text-slate-500 rounded-full transition-colors z-10 focus:outline-none focus:ring-2 focus:ring-indigo-500">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 md:h-7 md:w-7" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
                </svg>
            </button>

            <div class="p-8 md:p-12 overflow-y-auto hide-scrollbar">
                <div class="text-center">
                    <div class="inline-flex items-center justify-center w-12 h-12 md:w-16 md:h-16 rounded-2xl bg-indigo-50 text-indigo-600 font-bold text-xl md:text-2xl mb-6 shadow-inner" id="modal-topic-number">
                        1
                    </div>
                    
                    <h2 id="modal-question-en" class="text-3xl md:text-4xl font-bold text-slate-900 mb-8 leading-tight tracking-tight">
                        Question goes here?
                    </h2>
                    
                    <div class="flex flex-col sm:flex-row items-center justify-center gap-3 md:gap-4 mt-8 w-full mx-auto">
                        <!-- Translation Toggle Button -->
                        <button id="toggle-translation-btn" class="w-full sm:flex-1 px-6 py-4 bg-indigo-600 hover:bg-indigo-700 active:bg-indigo-800 text-white font-semibold text-lg rounded-2xl shadow-md transition-all duration-200 flex items-center justify-center space-x-2 focus:outline-none focus:ring-4 focus:ring-indigo-500/30">
                            <!-- Eye Icon -->
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
                            </svg>
                            <span>Translation</span>
                        </button>

                        <!-- Mark Completed Button -->
                        <button id="mark-completed-btn" class="w-full sm:flex-1 px-6 py-4 bg-emerald-500 hover:bg-emerald-600 active:bg-emerald-700 text-white font-semibold text-lg rounded-2xl shadow-md transition-all duration-200 flex items-center justify-center space-x-2 focus:outline-none focus:ring-4 focus:ring-emerald-500/30">
                            <!-- Check Icon -->
                            <svg id="completed-btn-icon" xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7" />
                            </svg>
                            <span id="completed-btn-text">Mark Complete</span>
                        </button>
                    </div>

                    <!-- Translation Container -->
                    <div id="translation-container" class="mt-8 p-6 md:p-8 bg-slate-50 rounded-2xl border border-slate-100 hidden opacity-0 transition-opacity duration-300 text-left">
                        <p class="text-sm text-indigo-500 mb-2 font-bold uppercase tracking-widest">Traditional Chinese</p>
                        <p id="modal-question-zh" class="text-xl md:text-2xl text-slate-700 font-medium leading-relaxed">
                            翻譯會在這裡顯示。
                        </p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Data: 50 Questions with English and Traditional Chinese
        const questionsData = [
            { en: "What is your favorite hobby and why?", zh: "你最喜歡的愛好是什麼？為什麼？" },
            { en: "Describe a person you admire.", zh: "描述一個你欽佩的人。" },
            { en: "If you could travel anywhere, where would you go?", zh: "如果你可以去任何地方旅行，你會去哪裡？" },
            { en: "What is the best movie you have ever seen?", zh: "你看過最好看的電影是什麼？" },
            { en: "Talk about a memorable childhood experience.", zh: "談談一個難忘的童年經歷。" },
            { en: "What are the advantages of learning English?", zh: "學習英語有什麼好處？" },
            { en: "Describe your ideal weekend.", zh: "描述你理想的週末。" },
            { en: "What kind of music do you like listening to?", zh: "你喜歡聽什麼樣的音樂？" },
            { en: "Do you prefer reading books or watching movies?", zh: "你比較喜歡看書還是看電影？" },
            { en: "Talk about a skill you would like to learn.", zh: "談談一項你想學習的技能。" },
            { en: "What is your favorite food and how do you make it?", zh: "你最喜歡的食物是什麼？怎麼做？" },
            { en: "Describe a festival or celebration in your country.", zh: "描述你國家的一個節日或慶典。" },
            { en: "How do you stay healthy?", zh: "你如何保持健康？" },
            { en: "What are your goals for the next five years?", zh: "你未來五年的目標是什麼？" },
            { en: "Talk about an important lesson you have learned.", zh: "談談你學到的一個重要教訓。" },
            { en: "Do you think social media has a positive or negative impact?", zh: "你認為社群媒體有正面還是負面的影響？" },
            { en: "Describe your dream job.", zh: "描述你夢想的工作。" },
            { en: "What is the most interesting place you have visited?", zh: "你去過最有趣的地方是哪裡？" },
            { en: "How has technology changed our lives?", zh: "科技如何改變了我們的生活？" },
            { en: "Talk about a time when you overcame a challenge.", zh: "談談你克服挑戰的一次經歷。" },
            { en: "What are the qualities of a good friend?", zh: "好朋友應該具備哪些特質？" },
            { en: "Do you prefer living in a city or the countryside?", zh: "你比較喜歡住在城市還是鄉下？" },
            { en: "Describe a book that influenced you.", zh: "描述一本影響你的書。" },
            { en: "What is your favorite season and why?", zh: "你最喜歡哪個季節？為什麼？" },
            { en: "Talk about a piece of advice that someone gave you.", zh: "談談別人給你的一條建議。" },
            { en: "How do you handle stress?", zh: "你如何處理壓力？" },
            { en: "What is the role of education in society?", zh: "教育在社會中扮演什麼角色？" },
            { en: "Describe a traditional dish from your culture.", zh: "描述你文化中的一道傳統菜餚。" },
            { en: "Do you think it's important to learn about history?", zh: "你認為學習歷史重要嗎？" },
            { en: "Talk about a famous person from your country.", zh: "談談你國家的一位名人。" },
            { en: "What are the benefits of playing sports?", zh: "做運動有什麼好處？" },
            { en: "Describe an invention that changed the world.", zh: "描述一項改變世界的發明。" },
            { en: "How do you think the world will change in 50 years?", zh: "你認為50年後世界會變成怎樣？" },
            { en: "Talk about an animal you find fascinating.", zh: "談談一種你覺得很迷人的動物。" },
            { en: "What is the best way to learn a new language?", zh: "學習新語言最好的方法是什麼？" },
            { en: "Describe a piece of art that you like.", zh: "描述一件你喜歡的藝術品。" },
            { en: "Do you prefer working alone or in a team?", zh: "你比較喜歡獨立工作還是團隊合作？" },
            { en: "Talk about a recent news event that caught your attention.", zh: "談談最近引起你注意的新聞事件。" },
            { en: "What are the most important environmental issues today?", zh: "當今最重要的環境問題是什麼？" },
            { en: "Describe a situation where you had to be polite.", zh: "描述一個你必須表現得有禮貌的情況。" },
            { en: "How important is money for happiness?", zh: "金錢對幸福有多重要？" },
            { en: "What are the advantages of public transportation?", zh: "大眾運輸有什麼優點？" },
            { en: "Talk about a habit you would like to change.", zh: "談談一個你想改變的習慣。" },
            { en: "Describe a place where you go to relax.", zh: "描述一個你去放鬆的地方。" },
            { en: "What are the pros and cons of online shopping?", zh: "網購的優缺點是什麼？" },
            { en: "Do you think advertising influences our choices?", zh: "你認為廣告會影響我們的選擇嗎？" },
            { en: "Talk about a time when you helped someone.", zh: "談談你幫助別人的一次經歷。" },
            { en: "What are the essential skills for the 21st century?", zh: "21世紀必備的技能有哪些？" },
            { en: "Describe a gift you received that was meaningful.", zh: "描述一份你收到且很有意義的禮物。" },
            { en: "How do you celebrate your birthday?", zh: "你如何慶祝你的生日？" }
        ];

        document.addEventListener('DOMContentLoaded', () => {
            const gridContainer = document.getElementById('challenge-grid');
            const modal = document.getElementById('questionModal');
            const modalTopicNumber = document.getElementById('modal-topic-number');
            const modalQuestionEn = document.getElementById('modal-question-en');
            const modalQuestionZh = document.getElementById('modal-question-zh');
            const translationContainer = document.getElementById('translation-container');
            const toggleTranslationBtn = document.getElementById('toggle-translation-btn');
            const markCompletedBtn = document.getElementById('mark-completed-btn');
            const completedBtnText = document.getElementById('completed-btn-text');
            const closeBtn = document.getElementById('close-modal-btn');

            let isTranslationShowing = false;
            let currentOpenIndex = -1;
            
            // Load completed questions from localStorage so progress isn't lost on refresh
            let completedQuestions = [];
            try {
                const saved = localStorage.getItem('englishChallengeCompleted');
                if (saved) {
                    completedQuestions = JSON.parse(saved);
                }
            } catch (e) {
                console.error("Could not load progress", e);
            }
            const completedSet = new Set(completedQuestions);

            // Generate the 50 elegant boxes
            for (let i = 0; i < 50; i++) {
                const box = document.createElement('button');
                box.type = 'button';
                box.dataset.index = i; // Store index on the element for easy access
                
                // Array of subtle modern gradients for the numbers
                const gradients = [
                    'from-blue-500 to-indigo-500',
                    'from-violet-500 to-fuchsia-500',
                    'from-emerald-400 to-teal-500',
                    'from-rose-400 to-orange-400',
                    'from-cyan-400 to-blue-500'
                ];
                const bgClass = gradients[i % gradients.length];
                
                // Check if this specific box was already completed in a previous session
                const isCompleted = completedSet.has(i);
                const completedClass = isCompleted ? 'completed' : '';

                box.className = `question-box ${completedClass} bg-white rounded-2xl md:rounded-3xl shadow-sm border border-slate-200/60 flex items-center justify-center relative overflow-hidden group focus:outline-none focus:ring-4 focus:ring-indigo-500/20`;
                
                // Added pointer-events-none to inner elements so they don't block the button's tap area
                // Included a hidden checkmark that appears when the 'completed' class is active
                box.innerHTML = `
                    <div class="absolute inset-0 bg-gradient-to-br ${bgClass} opacity-0 group-hover:opacity-[0.03] transition-opacity duration-300 pointer-events-none"></div>
                    
                    <span class="number-text text-4xl md:text-5xl font-black bg-clip-text text-transparent bg-gradient-to-br ${bgClass} pointer-events-none transition-colors duration-300">
                        ${i + 1}
                    </span>
                    
                    <div class="check-icon absolute top-3 right-3 md:top-4 md:right-4 text-emerald-500 pointer-events-none bg-emerald-100 rounded-full p-1 shadow-sm">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 md:h-5 md:w-5" viewBox="0 0 20 20" fill="currentColor">
                            <path fill-rule="evenodd" d="M16.707 5.293a1 1 0 010 1.414l-8 8a1 1 0 01-1.414 0l-4-4a1 1 0 011.414-1.414L8 12.586l7.293-7.293a1 1 0 011.414 0z" clip-rule="evenodd" />
                        </svg>
                    </div>
                `;

                box.addEventListener('click', (e) => {
                    e.preventDefault(); // Prevents default browser behaviors on touch
                    openModal(i);
                });
                gridContainer.appendChild(box);
            }

            // Function to open modal
            function openModal(index) {
                currentOpenIndex = index;
                const currentQuestionData = questionsData[index];
                
                // Set content
                modalTopicNumber.textContent = index + 1;
                modalQuestionEn.textContent = currentQuestionData.en;
                modalQuestionZh.textContent = currentQuestionData.zh;
                
                // Reset translation state to hidden
                isTranslationShowing = false;
                translationContainer.classList.add('hidden');
                translationContainer.classList.remove('opacity-100');
                translationContainer.classList.add('opacity-0');
                
                // Reset button appearance
                toggleTranslationBtn.innerHTML = `
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
                    </svg>
                    <span>Translation</span>
                `;
                toggleTranslationBtn.className = "w-full sm:flex-1 px-6 py-4 bg-indigo-600 hover:bg-indigo-700 active:bg-indigo-800 text-white font-semibold text-lg rounded-2xl shadow-md transition-all duration-200 flex items-center justify-center space-x-2 focus:outline-none focus:ring-4 focus:ring-indigo-500/30";

                updateCompletedModalButton(index);

                // Show modal with animation
                modal.style.display = "flex";
                // Trigger reflow to ensure CSS animation runs
                void modal.offsetWidth; 
                modal.classList.add('show');
                
                // Prevent background scrolling
                document.body.style.overflow = 'hidden';
            }

            // Function to toggle translation with smooth transitions
            toggleTranslationBtn.addEventListener('click', () => {
                isTranslationShowing = !isTranslationShowing;
                
                if (isTranslationShowing) {
                    translationContainer.classList.remove('hidden');
                    // Small delay to allow display:block to apply before animating opacity
                    setTimeout(() => {
                        translationContainer.classList.remove('opacity-0');
                        translationContainer.classList.add('opacity-100');
                    }, 10);
                    
                    // Update to 'Hide' state (Eye-off icon)
                    toggleTranslationBtn.innerHTML = `
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21" />
                        </svg>
                        <span>Hide Translation</span>
                    `;
                    toggleTranslationBtn.className = "w-full md:w-auto px-8 py-4 bg-slate-100 hover:bg-slate-200 active:bg-slate-300 text-slate-700 font-semibold text-lg rounded-2xl transition-all duration-200 flex items-center justify-center mx-auto space-x-2 focus:outline-none focus:ring-4 focus:ring-slate-500/30";
                } else {
                    translationContainer.classList.remove('opacity-100');
                    translationContainer.classList.add('opacity-0');
                    // Wait for fade out transition before hiding completely
                    setTimeout(() => {
                        translationContainer.classList.add('hidden');
                    }, 300);

                    // Revert to 'Show' state
                    toggleTranslationBtn.innerHTML = `
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
                        </svg>
                        <span>Show Translation</span>
                    `;
                    toggleTranslationBtn.className = "w-full md:w-auto px-8 py-4 bg-indigo-600 hover:bg-indigo-700 active:bg-indigo-800 text-white font-semibold text-lg rounded-2xl shadow-md transition-all duration-200 flex items-center justify-center mx-auto space-x-2 focus:outline-none focus:ring-4 focus:ring-indigo-500/30";
                }
            });

            function updateCompletedModalButton(index) {
                if (completedSet.has(index)) {
                    // Already completed state
                    markCompletedBtn.className = "w-full sm:flex-1 px-6 py-4 bg-slate-100 hover:bg-slate-200 active:bg-slate-300 text-slate-700 font-semibold text-lg rounded-2xl transition-all duration-200 flex items-center justify-center space-x-2 focus:outline-none focus:ring-4 focus:ring-slate-500/30";
                    completedBtnText.textContent = "Completed";
                    markCompletedBtn.querySelector('svg').innerHTML = '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />'; // X icon (to undo)
                } else {
                    // Not completed state
                    markCompletedBtn.className = "w-full sm:flex-1 px-6 py-4 bg-emerald-500 hover:bg-emerald-600 active:bg-emerald-700 text-white font-semibold text-lg rounded-2xl shadow-md transition-all duration-200 flex items-center justify-center space-x-2 focus:outline-none focus:ring-4 focus:ring-emerald-500/30";
                    completedBtnText.textContent = "Mark Complete";
                    markCompletedBtn.querySelector('svg').innerHTML = '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7" />'; // Check icon
                }
            }

            markCompletedBtn.addEventListener('click', () => {
                if (currentOpenIndex === -1) return;

                // Toggle logic
                if (completedSet.has(currentOpenIndex)) {
                    completedSet.delete(currentOpenIndex);
                } else {
                    completedSet.add(currentOpenIndex);
                }

                // Save to localStorage
                try {
                    localStorage.setItem('englishChallengeCompleted', JSON.stringify(Array.from(completedSet)));
                } catch (e) {
                    console.error("Could not save progress", e);
                }

                // Update the grid box visually
                const box = document.querySelector(`.question-box[data-index="${currentOpenIndex}"]`);
                if (box) {
                    if (completedSet.has(currentOpenIndex)) {
                        box.classList.add('completed');
                    } else {
                        box.classList.remove('completed');
                    }
                }

                // Update the button inside the modal to reflect the new state
                updateCompletedModalButton(currentOpenIndex);
                
                // Optional: Auto-close modal after marking complete (giving a tiny delay so they see the button change)
                if (completedSet.has(currentOpenIndex)) {
                    setTimeout(closeModal, 400); 
                }
            });

            // Close modal functions
            function closeModal() {
                modal.classList.remove('show');
                setTimeout(() => {
                    modal.style.display = "none";
                    document.body.style.overflow = 'auto'; // Restore background scrolling
                }, 300); // Matches CSS transition duration
            }

            closeBtn.addEventListener('click', closeModal);

            // Close when clicking outside the modal content
            modal.addEventListener('click', (event) => {
                if (event.target === modal) {
                    closeModal();
                }
            });
            
            // Close on Escape key
            document.addEventListener('keydown', (event) => {
                if (event.key === 'Escape' && modal.style.display === "flex") {
                    closeModal();
                }
            });
        });
    </script>
</body>
</html>
